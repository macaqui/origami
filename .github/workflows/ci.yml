name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Pruebas del backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: origami_db
          MYSQL_USER: origami
          MYSQL_PASSWORD: origami123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        working-directory: server
        run: npm ci

      - name: Crear el esquema y los datos de ejemplo
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot < server/database.sql

      - name: Ejecutar las pruebas
        working-directory: server
        run: npm test
        env:
          PORT: 3001
          DB_HOST: 127.0.0.1
          DB_USER: origami
          DB_PASSWORD: origami123
          DB_NAME: origami_db

  frontend:
    name: Compilación del frontend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        working-directory: client
        run: npm ci

      - name: Revisar el código (lint)
        working-directory: client
        run: npm run lint

      - name: Compilar para producción
        working-directory: client
        run: npm run build
